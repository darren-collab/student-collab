<!DOCTYPE html>
<html>
<head>
	<title>Sign up</title>
	<!--<link rel="stylesheet" type="text/css" href="slide navbar style.css">-->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">

<style>

 @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}
html,body{
  display: grid;
  height: 100%;
  width: 100%;
  place-items: center;
  background: -webkit-linear-gradient(left, #003366,#004080,#0059b3
, #0073e6);
}
::selection{
  background: #1a75ff;
  color: #fff;
}
.wrapper{
  overflow: hidden;
  max-width: 390px;
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0px 15px 20px rgba(0,0,0,0.1);
  position:relative;
  z-index:1;
}
.wrapper .title-text{
  display: flex;
  width: 200%;
}
.wrapper .title{
  width: 50%;
  font-size: 35px;
  font-weight: 600;
  text-align: center;
  transition: all 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.wrapper .slide-controls{
  position: relative;
  display: flex;
  height: 50px;
  width: 100%;
  overflow: hidden;
  margin: 30px 0 10px 0;
  justify-content: space-between;
  border: 1px solid lightgrey;
  border-radius: 15px;
}
.slide-controls .slide{
  height: 100%;
  width: 100%;
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  text-align: center;
  line-height: 48px;
  cursor: pointer;
  z-index: 1;
  transition: all 0.6s ease;
}
.slide-controls label.signup{
  color: #000;
}
.slide-controls .slider-tab{
  position: absolute;
  height: 100%;
  width: 50%;
  left: 0;
  z-index: 0;
  border-radius: 15px;
background: linear-gradient(to right, #928bff, #c9c1ff);




  transition: all 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
}
input[type="radio"]{
  display: none;
}
#signup:checked ~ .slider-tab{
  left: 50%;
}
#signup:checked ~ label.signup{
  color: #fff;
  cursor: default;
  user-select: none;
}
#signup:checked ~ label.login{
  color: #000;
}
#login:checked ~ label.signup{
  color: #000;
}
#login:checked ~ label.login{
  cursor: default;
  user-select: none;
}
.wrapper .form-container{
  width: 100%;
  overflow: hidden;
}
.form-container .form-inner{
  display: flex;
  width: 200%;
}
.form-container .form-inner form{
  width: 50%;
  transition: all 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.form-inner form .field{
  height: 50px;
  width: 100%;
  margin-top: 20px;
}
.form-inner form .field input{
  height: 100%;
  width: 100%;
  outline: none;
  padding-left: 15px;
  border-radius: 15px;
  border: 1px solid lightgrey;
  border-bottom-width: 2px;
  font-size: 17px;
  transition: all 0.3s ease;
}
.form-inner form .field input:focus{
  border-color: #1a75ff;
  /* box-shadow: inset 0 0 3px #fb6aae; */
}
.form-inner form .field input::placeholder{
  color: #999;
  transition: all 0.3s ease;
}
form .field input:focus::placeholder{
  color: #1a75ff;
}
.form-inner form .pass-link{
  margin-top: 5px;
}
.form-inner form .signup-link{
  text-align: center;
  margin-top: 30px;
}
.form-inner form .pass-link a,
.form-inner form .signup-link a{
  color: #1a75ff;
  text-decoration: none;
}
.form-inner form .pass-link a:hover,
.form-inner form .signup-link a:hover{
  text-decoration: underline;
}
form .btn{
  height: 50px;
  width: 100%;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
}
form .btn .btn-layer{
  height: 100%;
  width: 300%;
  position: absolute; 
  left: -100%;
  background: linear-gradient(to right, #928bff, #c2b8ff);

  border-radius: 15px;
  transition: all 0.4s ease;;
}
form .btn:hover .btn-layer{
  left: 0;
}
form .btn input[type="submit"]{
  height: 100%;
  width: 100%;
  z-index: 1;
  position: relative;
  background: none;
  border: none;
  color: #fff;
  padding-left: 0;
  border-radius: 15px;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
}

.message-container {
  margin-top: 10px;
}

.message {
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 4px;
  margin-bottom: 10px;
}

.message.success {
  background-color: #d1e7dd;
  color: #0f5132;
}

.message.error {
  background-color: #f8d7da;
  color: #842029;
}

.area{
background: linear-gradient(to right, #928bff, #c2b9ff);

  position:fixed;           
  inset:0;
  width:100%;
  height:100vh;
  z-index:0;
}
.circles{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  overflow:hidden;
  pointer-events:none;
}
.circles li{
  position:absolute;
  display:block;
  list-style:none;
  width:20px;
  height:20px;
  background:rgba(255,255,255,0.2);
  animation:animate 25s linear infinite;
  bottom:-150px;
}
.circles li:nth-child(1){left:25%;width:80px;height:80px;animation-delay:0s;}
.circles li:nth-child(2){left:10%;width:20px;height:20px;animation-delay:2s;animation-duration:12s;}
.circles li:nth-child(3){left:70%;width:20px;height:20px;animation-delay:4s;}
.circles li:nth-child(4){left:40%;width:60px;height:60px;animation-delay:0s;animation-duration:18s;}
.circles li:nth-child(5){left:65%;width:20px;height:20px;animation-delay:0s;}
.circles li:nth-child(6){left:75%;width:110px;height:110px;animation-delay:3s;}
.circles li:nth-child(7){left:35%;width:150px;height:150px;animation-delay:7s;}
.circles li:nth-child(8){left:50%;width:25px;height:25px;animation-delay:15s;animation-duration:45s;}
.circles li:nth-child(9){left:20%;width:15px;height:15px;animation-delay:2s;animation-duration:35s;}
.circles li:nth-child(10){left:85%;width:150px;height:150px;animation-delay:0s;animation-duration:11s;}
@keyframes animate{
  0%{transform:translateY(0) rotate(0deg);opacity:1;border-radius:0;}
  100%{transform:translateY(-1000px) rotate(720deg);opacity:0;border-radius:50%;}
}
</style>
</head>
<body>
  <!-- animation background -->
  <div class="area">
    <ul class="circles">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
  </div>

  <div class="wrapper">
      <div class="title-text">
        <div class="title login">Login Form</div>
        <div class="title signup">Signup Form</div>
      </div>
      <div class="form-container">
        <div class="slide-controls">
          <input type="radio" name="slide" id="login" {% if not show_signup %}checked{% endif %}>
<input type="radio" name="slide" id="signup" {% if show_signup %}checked{% endif %}>

          <label for="login" class="slide login">Login</label>
          <label for="signup" class="slide signup">Signup</label>
          <div class="slider-tab"></div>
        </div>
        <div class="form-inner">
  <form method="POST" action="{% url 'login' %}" class="login">
    {% csrf_token %}
    <div class="field">
      <input type="text" name="username" placeholder="Username"  maxlength="12" required >
    </div>
    <div class="field">
      <input type="password" name="pswd" placeholder="Password"  maxlength="12" minlength="6" required>
    </div>
    {% if login_error %}
  <p class="message error" style="margin-top: 10px;">{{ login_error }}</p>
{% endif %}
    <!-- <div class="pass-link"><a href="#">Forgot password?</a></div> -->
    <div class="field btn">
      <div class="btn-layer"></div>
      <input type="submit" value="Login">
    </div>
    <div class="signup-link">Not a member? <a href="">Signup now</a></div>
  </form>

  <form method="POST" action="{% url 'signup' %}" class="signup">
    {% csrf_token %}
    <div class="field">
      <input type="text" name="username" placeholder="Username"   maxlength="12" required>
    </div>
    <div class="field">
      <input type="email" name="email" placeholder="Email Address"  maxlength="50" minlength="10"  required required pattern=".*\.com.*" title='Email must contain ".com"'>
    </div>
    <div class="field">
      <input type="password" name="pswd" placeholder="Password"  maxlength="12" minlength="6" required>
    </div>
    <div class="field">
      <input type="password" name="confirm_pswd" placeholder="Confirm password"  maxlength="12" minlength="6" required>
    </div>
	{% if messages %}
  <div class="message-container">
    {% for message in messages %}
      <p class="message {{ message.tags }}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
    <div class="field btn">
      <div class="btn-layer"></div>
      <input type="submit" value="Signup">
    </div>
  </form>
</div>

      </div>
    </div>


	<script>
		 const loginText = document.querySelector(".title-text .login");
  const loginForm = document.querySelector("form.login");
  const loginBtn = document.querySelector("label.login");
  const signupBtn = document.querySelector("label.signup");
  const signupLink = document.querySelector("form .signup-link a");
  const loginRadio = document.getElementById("login");
  const signupRadio = document.getElementById("signup");

  signupBtn.onclick = () => {
    loginForm.style.marginLeft = "-50%";
    loginText.style.marginLeft = "-50%";
  };

  loginBtn.onclick = () => {
    loginForm.style.marginLeft = "0%";
    loginText.style.marginLeft = "0%";
  };

  signupLink.onclick = () => {
    signupBtn.click();
    return false;
  };

  // reflect radio state on page load
  window.addEventListener("DOMContentLoaded", () => {
    if (signupRadio.checked) {
      loginForm.style.marginLeft = "-50%";
      loginText.style.marginLeft = "-50%";
    } else {
      loginForm.style.marginLeft = "0%";
      loginText.style.marginLeft = "0%";
    }
  });
	</script>
</body>
</html>
