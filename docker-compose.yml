version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collabspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8001 CollabSpace.asgi:application & python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: collabspace
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
