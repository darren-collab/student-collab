name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: collabspace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest pytest-django
    
    - name: Run migrations
      env:
        DB_NAME: collabspace_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
      run: python manage.py migrate
    
    - name: Run tests
      env:
        DB_NAME: collabspace_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
      run: |
        python manage.py test
    
    - name: Code quality checks
      run: |
        pip install flake8
        flake8 collab --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 collab --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: student-collab:ci
    
    - name: Test Docker image
      run: |
        docker run --rm student-collab:ci python manage.py --help
